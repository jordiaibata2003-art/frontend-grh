<div class="container py-4" style="max-width: 860px;">

  <div class="page-header">
    <div>
      <h2><i class="fas fa-user-plus text-primary me-2"></i>{{ isEditMode ? 'Modifier un employé' : 'Ajouter un employé' }}</h2>
      <p class="page-subtitle">Les champs marqués d'un * sont obligatoires</p>
    </div>
  </div>

  <div class="card p-4">
    <form #f="ngForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Matricule *</label>
          <input type="text" class="form-control" [(ngModel)]="employe.matricule" name="matricule" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Nom *</label>
          <input type="text" class="form-control" [(ngModel)]="employe.nom" name="nom" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Prénom *</label>
          <input type="text" class="form-control" [(ngModel)]="employe.prenom" name="prenom" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Email *</label>
          <input type="email" class="form-control" [(ngModel)]="employe.email" name="email" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date d'embauche *</label>
          <input type="date" class="form-control" [(ngModel)]="employe.dateEmbauche" name="dateEmbauche" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Poste *</label>
          <input type="text" class="form-control" [(ngModel)]="employe.poste" name="poste" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Département</label>
          <input type="text" class="form-control" [(ngModel)]="employe.departement" name="departement">
        </div>

      </div>

      <hr class="my-4">

      <div class="d-flex gap-2 justify-content-end">
        <a routerLink="/employes" class="btn btn-light border">
          <i class="fas fa-arrow-left me-2"></i>Annuler
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
          <i class="fas fa-save me-2"></i>{{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>

</div>
