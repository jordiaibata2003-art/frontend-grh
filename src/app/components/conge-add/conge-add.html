<div class="container py-4" style="max-width: 860px;">

  <div class="page-header">
    <div>
      <h2><i class="fas fa-calendar-plus text-primary me-2"></i>{{ isEditMode ? 'Modifier un congé' : 'Nouveau congé' }}</h2>
      <p class="page-subtitle">Les champs marqués d'un * sont obligatoires</p>
    </div>
  </div>

  <div class="card p-4">
    <form #f="ngForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Employé *</label>
          <select class="form-select" [(ngModel)]="conge.employe_id" name="employe_id" required>
            <option value="">Sélectionner un employé</option>
            <option *ngFor="let employe of employes" [value]="employe.id">{{ employe.nom }} {{ employe.prenom }}</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Type de congé *</label>
          <select class="form-select" [(ngModel)]="conge.type" name="type" required>
            <option value="">Sélectionner</option>
            <option value="annuel">Annuel</option>
            <option value="maladie">Maladie</option>
            <option value="exceptionnel">Exceptionnel</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date de début *</label>
          <input type="date" class="form-control" [(ngModel)]="conge.dateDebut" name="dateDebut" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date de fin *</label>
          <input type="date" class="form-control" [(ngModel)]="conge.dateFin" name="dateFin" required>
        </div>
        <div class="col-12">
          <label class="form-label">Motif</label>
          <textarea class="form-control" rows="3" [(ngModel)]="conge.motif" name="motif"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Statut</label>
          <select class="form-select" [(ngModel)]="conge.statut" name="statut">
            <option value="en_attente">En attente</option>
            <option value="valide">Validé</option>
            <option value="refuse">Refusé</option>
          </select>
        </div>
      </div>

      <hr class="my-4">

      <div class="d-flex gap-2 justify-content-end">
        <a routerLink="/conges" class="btn btn-light border">
          <i class="fas fa-arrow-left me-2"></i>Annuler
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
          <i class="fas fa-save me-2"></i>{{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>

</div>
