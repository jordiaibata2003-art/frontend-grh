<div class="container py-4" style="max-width: 860px;">

  <div class="page-header">
    <div>
      <h2><i class="fas fa-file-contract text-primary me-2"></i>{{ isEditMode ? 'Modifier un contrat' : 'Ajouter un contrat' }}</h2>
      <p class="page-subtitle">Les champs marqués d'un * sont obligatoires</p>
    </div>
  </div>

  <div class="card p-4">
    <form #f="ngForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Employé *</label>
          <select class="form-select" [(ngModel)]="contrat.employe_id" name="employe_id" required>
            <option value="">Sélectionner un employé</option>
            <option *ngFor="let employe of employes" [value]="employe.id">{{ employe.nom }} {{ employe.prenom }} ({{ employe.matricule }})</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Type de contrat *</label>
          <select class="form-select" [(ngModel)]="contrat.typeContrat" name="typeContrat" required>
            <option value="">Sélectionner un type</option>
            <option value="CDI">CDI</option>
            <option value="CDD">CDD</option>
            <option value="VACATAIRE">Vacataire</option>
            <option value="STAGE">Stage</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date de début *</label>
          <input type="date" class="form-control" [(ngModel)]="contrat.dateDebut" name="dateDebut" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date de fin</label>
          <input type="date" class="form-control" [(ngModel)]="contrat.dateFin" name="dateFin">
          <div class="form-text">Laisser vide pour un contrat en cours.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Salaire (FCFA) *</label>
          <input type="number" class="form-control" [(ngModel)]="contrat.salaire" name="salaire" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Statut</label>
          <select class="form-select" [(ngModel)]="contrat.statut" name="statut">
            <option value="actif">Actif</option>
            <option value="expire">Expiré</option>
            <option value="termine">Terminé</option>
          </select>
        </div>
      </div>

      <hr class="my-4">

      <div class="d-flex gap-2 justify-content-end">
        <a routerLink="/contrats" class="btn btn-light border">
          <i class="fas fa-arrow-left me-2"></i>Annuler
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">
          <i class="fas fa-save me-2"></i>{{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>

</div>
